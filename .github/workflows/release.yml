name: Release
on:
  push: {tags: ['v*']}
permissions: {contents: write}
env: {CARGO_TERM_COLOR: always}
jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: '${{ matrix.target }}'}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          n=spoilheap-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$n"
          cp README.md LICENSE "dist/$n/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/spoilheap.exe "dist/$n/"
            (cd dist && 7z a -bd "$n.zip" "$n" >/dev/null)
          else
            cp target/${{ matrix.target }}/release/spoilheap "dist/$n/"
            (cd dist && tar czf "$n.tar.gz" "$n")
          fi
          rm -rf "dist/$n"
      - if: "!contains(matrix.target, 'windows') && !(matrix.target == 'x86_64-apple-darwin')"
        name: smoke-test the packaged binary
        shell: bash
        run: |
          tar xzf dist/*.tar.gz -C dist && ./dist/spoilheap-*/spoilheap version && ./dist/spoilheap-*/spoilheap --home "$RUNNER_TEMP" --root "$RUNNER_TEMP"
          rm -rf dist/spoilheap-*/
      - uses: actions/upload-artifact@v4
        with: {name: '${{ matrix.target }}', path: 'dist/*'}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: {path: dist, merge-multiple: true}
      - name: checksums and release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          set -euo pipefail
          cp install.sh dist/
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
          notes=$(awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^## "t {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "spoilheap $GITHUB_REF_NAME" --notes "$notes" || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
